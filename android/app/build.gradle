plugins { id 'com.android.application' }
android {
 namespace 'org.monzobot.app'
 compileSdk 35
 buildToolsVersion "35.0.0"
 defaultConfig { applicationId 'org.monzobot.app'; minSdk 30; targetSdk 35; versionCode 300; versionName '0.3.0-alpha' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 sourceSets { test.java.srcDirs += ["../domain-tests", "../sync-tests"] }
 testOptions {
  unitTests.includeAndroidResources = true
  unitTests.all {
   systemProperty "fixturePath", rootProject.file("../fixtures/synthetic.csv").absolutePath
   systemProperty "robolectric.dependency.repo.url", "https://repo.maven.apache.org/maven2"
   ['http.proxyHost','http.proxyPort','https.proxyHost','https.proxyPort','javax.net.ssl.trustStore'].each { name -> if (System.getProperty(name)) systemProperty name, System.getProperty(name) }
   jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED','--add-opens=java.base/java.util=ALL-UNNAMED','--add-opens=java.base/java.io=ALL-UNNAMED','--add-opens=java.base/java.net=ALL-UNNAMED','--add-opens=java.base/java.security=ALL-UNNAMED','--add-opens=java.base/java.text=ALL-UNNAMED','--add-opens=java.base/jdk.internal.access=ALL-UNNAMED','--add-opens=java.desktop/java.awt.font=ALL-UNNAMED','--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED'
  }
 }
 buildTypes { release { minifyEnabled false } }
}
dependencies {
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.17'
 testImplementation 'org.json:json:20240303'
 implementation 'androidx.activity:activity:1.9.3'
 implementation 'androidx.core:core:1.13.1'
 implementation 'androidx.work:work-runtime:2.9.1'
 implementation 'com.google.android.gms:play-services-auth:22.0.0'
}
